<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<title>StyleCue, Photo credits</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/mobile.css" />
<style>body { display: block; } .credit { display:grid; grid-template-columns:4rem 1fr; gap:.8rem; padding:.8rem 0; border-top:1px solid var(--line-on-bone); font-size:.85rem; line-height:1.5; } .credit img { width:4rem; height:5rem; object-fit:cover; border-radius:8px; } .credit--text { grid-template-columns:1fr; } .credit-h { font-family:Fraunces,serif; font-style:italic; margin:1.6rem 0 .4rem; } .credit-group summary { padding:.8rem 0; font-weight:600; cursor:pointer; text-transform:capitalize; border-top:1px solid var(--line-on-bone); } .credit a { color:var(--ink); }</style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <main id="main" class="styleguide">
    <h1 class="styleguide__title">Photo credits</h1>
    <p class="styleguide__sub">Photos in this prototype come from Unsplash and are used under the Unsplash licence. Style images that are not listed here are drawings made for this prototype, and they will be replaced with photos.</p>
    <div id="list"></div>
  </main>
  <script type="module" src="js/ui.js"></script>
  <script type="module">
    import { renderNav } from "./js/nav.js";
    renderNav("profile");
    const list = document.getElementById("list");
    try {
      const res = await fetch("images/credits.json");
      if (!res.ok) throw new Error("none");
      const items = await res.json();
      list.innerHTML = [].concat(items).map((c) => `
        <div class="credit"><img src="${c.path}" alt="" />
        <div><a href="${c.photoUrl}" target="_blank" rel="noopener">${c.title}</a><br/>
        Photo by <a href="${c.photographerUrl}" target="_blank" rel="noopener">${c.photographer}</a> (${c.year}) on Unsplash</div></div>`).join("");
    } catch {
      list.innerHTML = '<div class="styleguide-nudge">No photos have been added yet. The style images are drawn illustrations.</div>';
    }
    try {
      const gres = await fetch("images/gallery.json");
      if (gres.ok) {
        const g = [].concat(await gres.json());
        const by = {};
        g.forEach((p) => (by[p.style] = by[p.style] || []).push(p));
        const html = Object.keys(by).sort().map((s) => `<details class="credit-group"><summary>${s} (${by[s].length} photos in the Look Library)</summary>` +
          by[s].map((p) => `<div class="credit credit--text"><div><a href="${p.links.html}?utm_source=stylecue&utm_medium=referral" target="_blank" rel="noopener">${p.alt_description}</a><br/>Photo by <a href="${p.user.links.html}?utm_source=stylecue&utm_medium=referral" target="_blank" rel="noopener">${p.user.name}</a> (${p.year}) on Unsplash</div></div>`).join("") + "</details>").join("");
        list.insertAdjacentHTML("beforeend", `<h2 class="credit-h">Look Library photos</h2>${html}`);
      }
    } catch {}
  </script>
</body>
</html>
