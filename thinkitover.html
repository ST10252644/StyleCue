<!DOCTYPE html>

<title>StyleCue, Think it over</title>

  <a class="skip-link" href="#main">Skip to main content</a>
  <main id="main" class="styleguide">

    <img class="page-banner" src="images/closet/pause_coffee_notebook.jpg" alt="A coffee and a notebook, taking a pause" decoding="async" />
    <div class="how-measure how-measure--2">
      <figure><img src="images/closet/shopping_bag_aside.jpg" alt="A shopping bag set aside" loading="lazy" decoding="async" /><figcaption>Set it aside, not in the checkout</figcaption></figure>
      <figure><img src="images/closet/reading_care_label.jpg" alt="Reading a clothing care label" loading="lazy" decoding="async" /><figcaption>Read the label before you decide</figcaption></figure>
    </div>
    <div id="content"></div>
  </main>
  <script type="module" src="js/ui.js"></script>
