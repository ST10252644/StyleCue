<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#1e1537" />
<title>StyleCue, Look library</title>
<link rel="stylesheet" href="css/style.css?v=3" />
<link rel="stylesheet" href="css/mobile.css?v=5" />
<link rel="stylesheet" href="css/theme.css?v=3" />
<style>body { display: block; }</style>
</head>
<body>

  <a class="skip-link" href="#main">Skip to main content</a>
  <main id="main" class="library">
    <h1 class="library__title">Your look library</h1>
    <p class="library__sub">
      Pulled from your body shape and style personality, search anything else you're curious about too.
    </p>

    <div class="library__profile-chip" id="profile-chip" style="display:none;">
      <span class="dot"></span> <span id="profile-chip-text"></span>
    </div>

    <form class="library-search" id="search-form">
      <input type="text" id="search-input" placeholder="Try “old money”, “cottagecore”, “edgy streetwear”…" autocomplete="off" required />
      <button type="submit" class="btn-primary">Search</button>
    </form>

    <div class="library-tags" id="quick-tags"></div>
    <h2 class="photo-strip__title" style="margin-top:.75rem;">Body shapes</h2>
    <div class="library-tags" id="body-tags"></div>
    <h2 class="photo-strip__title" style="margin-top:.75rem;">Trends</h2>
    <div class="library-tags" id="trend-tags"></div>

    <div class="library-status" id="status"></div>
    <div class="library-grid" id="results"></div>
  </main>

  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/library-app.js"></script>
</body>
</html>
