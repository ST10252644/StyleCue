<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#1e1537" />
<title>StyleCue, My activity</title>
<link rel="stylesheet" href="css/style.css?v=3" />
<link rel="stylesheet" href="css/mobile.css?v=5" />
<link rel="stylesheet" href="css/theme.css?v=1" />
<style>body { display: block; }</style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <main id="main" class="styleguide">
    <h1 class="styleguide__title">My activity</h1>
    <p class="styleguide__sub">A summary of how you used StyleCue. It is stored only on this phone.</p>
    <section class="profile-panel">
      <h2>Usage</h2>
      <div class="stat-grid" id="stats"></div>
    </section>
    <section class="profile-panel">
      <h2>Your feedback</h2>
      <div id="fb-list"></div>
    </section>
    <section class="profile-panel">
      <h2>Your data</h2>
      <p class="field-hint">Download everything this page shows as a file you can keep or share with the researcher.</p>
      <button class="btn-primary" id="download" style="width:auto;">Download my data</button>
    </section>
  </main>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/insights-app.js"></script>
</body>
</html>
