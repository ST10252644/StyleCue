name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir www-build
          cp -r *.html css js images www-build/
      - name: Add Android platform
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk StyleCue.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StyleCue-apk
          path: StyleCue.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: StyleCue APK (latest)
          body: Download StyleCue.apk on your phone and open it to install (allow installs from this source when asked).
          files: StyleCue.apk
          make_latest: true
